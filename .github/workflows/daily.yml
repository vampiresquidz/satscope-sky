name: daily sky summary
on:
  schedule:
    - cron: "17 6 * * *"   # once a day, 06:17 UTC (CelesTrak refreshes SATCAT overnight)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python sky_summary.py sky.json
      - name: commit
        run: |
          git config user.name "satscope-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sky.json
          git diff --cached --quiet || git commit -m "sky: $(date -u +%F)"
          git push
